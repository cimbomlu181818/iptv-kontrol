plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    namespace 'com.example.iptvcheckerapp'

    defaultConfig {
        applicationId "com.example.iptvcheckerapp"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Bu uygulama dış kütüphane kullanmaz (sadece Android'in kendi sınıfları).
dependencies {
}
